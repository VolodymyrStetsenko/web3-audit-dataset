[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "web3-audit-dataset"
version = "0.1.0"
description = "Reproducible local corpus builder for Web3 security research"
readme = "README.md"
license = "Apache-2.0"
authors = [
  {name = "Volodymyr Stetsenko"},
]
requires-python = ">=3.11"
keywords = [
  "data-engineering",
  "rag",
  "security-research",
  "smart-contract-security",
  "web3-security",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database :: Database Engines/Servers",
  "Topic :: Security",
]
dependencies = [
  "aiohttp>=3.10,<4",
  "pypdf>=5.0,<7",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23,<5",
  "pytest>=8.3,<9",
]

[project.scripts]
web3-dataset = "web3_dataset.cli:main"

[project.urls]
Documentation = "https://github.com/VolodymyrStetsenko/web3-audit-dataset#readme"
Issues = "https://github.com/VolodymyrStetsenko/web3-audit-dataset/issues"
Repository = "https://github.com/VolodymyrStetsenko/web3-audit-dataset"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
